version: '3.8'

services:
  db:
    image: postgres:15
    container_name: postgres_anomaly_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: anomaly_database
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: anomaly_python_app
    depends_on:
      - db
    environment:
      - DB_HOST=db  

volumes:
  postgres_data: